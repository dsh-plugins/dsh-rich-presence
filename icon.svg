<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none" role="img" aria-label="Discord rich presence">
  <!--
    An activity card: the two lines are the `details` and `state` rows Discord
    renders, and the badge on the top-right corner is the presence itself.
    The badge sits in a hole cut out of the card by the mask rather than on a
    painted ring, so the gap keeps the page background whatever the theme is.
  -->
  <mask id="rp-badge-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
    <rect width="36" height="36" fill="#ffffff"/>
    <circle cx="31.1" cy="9.2" r="4.6" fill="#000000"/>
  </mask>
  <g mask="url(#rp-badge-cut)">
    <rect x="3.6" y="8.8" width="28.2" height="20.4" rx="5.8" fill="url(#rp-card)"/>
    <path d="M9.3 16.8h13.9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.94"/>
    <path d="M9.3 22.2h9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>
  <circle cx="31.1" cy="9.2" r="3" fill="#45d9e7"/>
  <defs>
    <linearGradient id="rp-card" x1="3.6" y1="8.8" x2="31.8" y2="29.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ccffd"/>
      <stop offset="1" stop-color="#4472e8"/>
    </linearGradient>
  </defs>
</svg>
